
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peter Mbugua - Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            font-family: 'VT323', monospace;
            overflow-x: hidden;
        }
        @keyframes flicker {
            0% { opacity: 0.99; }
            5% { opacity: 0.95; }
            10% { opacity: 0.97; }
            15% { opacity: 0.95; }
            20% { opacity: 0.98; }
            100% { opacity: 1; }
        }
        .crt-scanline {
            background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.15) 50%);
            background-size: 100% 4px;
            pointer-events: none;
        }
        .crt-glow {
            text-shadow: 0 0 8px rgba(52, 211, 153, 0.6);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 20, 0, 0.2);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(16, 185, 129, 0.2);
            border-radius: 0;
            border: 2px solid black;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(16, 185, 129, 0.4);
        }
        
        /* Minecraft / Blocky style helpers */
        .block-border {
            border: 4px solid #1a1a1a;
            box-shadow: 
                inset 4px 4px 0 #fff,
                inset -4px -4px 0 #888,
                4px 4px 0 rgba(0,0,0,0.5);
        }
        .block-btn {
            background: #7a7a7a;
            border: 4px solid #000;
            box-shadow: inset 4px 4px 0 #aaa, inset -4px -4px 0 #444;
            transition: all 0.1s;
        }
        .block-btn:active {
            box-shadow: inset -4px -4px 0 #aaa, inset 4px 4px 0 #444;
            transform: translate(2px, 2px);
        }
    </style>
<script type="importmap">

}

</html>
