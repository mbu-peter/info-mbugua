<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#334155;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#475569;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- Header -->
  <rect x="0" y="0" width="600" height="80" fill="#0f172a"/>
  <text x="30" y="35" fill="#10b981" font-family="Arial, sans-serif" font-size="24" font-weight="bold">FINLY</text>
  <text x="30" y="55" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">Financial Management Dashboard</text>

  <!-- Navigation -->
  <rect x="200" y="25" width="80" height="30" fill="#10b981" rx="15"/>
  <text x="240" y="43" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Dashboard</text>

  <!-- Main Content -->
  <rect x="30" y="100" width="340" height="120" fill="url(#card)" rx="8"/>
  <text x="50" y="125" fill="#10b981" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Total Balance</text>
  <text x="50" y="150" fill="white" font-family="Arial, sans-serif" font-size="28" font-weight="bold">$12,847.92</text>
  <text x="50" y="170" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">+2.5% from last month</text>

  <!-- Charts Area -->
  <rect x="30" y="240" width="250" height="120" fill="url(#card)" rx="8"/>
  <text x="50" y="265" fill="#10b981" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Expense Breakdown</text>

  <!-- Mock Chart Bars -->
  <rect x="50" y="280" width="40" height="60" fill="#10b981"/>
  <rect x="100" y="290" width="40" height="50" fill="#3b82f6"/>
  <rect x="150" y="275" width="40" height="75" fill="#f59e0b"/>
  <rect x="200" y="300" width="40" height="40" fill="#ef4444"/>

  <!-- Sidebar -->
  <rect x="400" y="100" width="170" height="260" fill="url(#card)" rx="8"/>
  <text x="420" y="125" fill="#10b981" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Recent Transactions</text>

  <!-- Transaction Items -->
  <circle cx="430" cy="150" r="8" fill="#10b981"/>
  <text x="450" y="155" fill="white" font-family="Arial, sans-serif" font-size="12">Grocery Store</text>
  <text x="520" y="155" fill="#ef4444" font-family="Arial, sans-serif" font-size="12">-$85.20</text>

  <circle cx="430" cy="180" r="8" fill="#3b82f6"/>
  <text x="450" y="185" fill="white" font-family="Arial, sans-serif" font-size="12">Salary Deposit</text>
  <text x="520" y="185" fill="#10b981" font-family="Arial, sans-serif" font-size="12">+$3,200.00</text>

  <circle cx="430" cy="210" r="8" fill="#f59e0b"/>
  <text x="450" y="215" fill="white" font-family="Arial, sans-serif" font-size="12">Electric Bill</text>
  <text x="520" y="215" fill="#ef4444" font-family="Arial, sans-serif" font-size="12">-$124.50</text>
</svg>
