<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chartBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#334155;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#475569;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- Header -->
  <rect x="0" y="0" width="600" height="80" fill="#0f172a"/>
  <text x="30" y="35" fill="#10b981" font-family="Arial, sans-serif" font-size="24" font-weight="bold">FINLY</text>
  <text x="30" y="55" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">Analytics & Insights</text>

  <!-- Navigation -->
  <rect x="200" y="25" width="100" height="30" fill="#10b981" rx="15"/>
  <text x="250" y="43" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Analytics</text>

  <!-- Main Chart -->
  <rect x="30" y="100" width="540" height="250" fill="url(#chartBg)" rx="8"/>

  <!-- Chart Title -->
  <text x="50" y="130" fill="#10b981" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Monthly Spending Trends</text>

  <!-- Mock Line Chart -->
  <path d="M 80 300 L 120 280 L 160 260 L 200 290 L 240 250 L 280 240 L 320 220 L 360 230 L 400 210 L 440 200 L 480 190 L 520 180"
        stroke="#10b981" stroke-width="3" fill="none"/>
  <path d="M 80 320 L 120 310 L 160 290 L 200 320 L 240 280 L 280 270 L 320 250 L 360 260 L 400 240 L 440 230 L 480 220 L 520 210"
        stroke="#3b82f6" stroke-width="3" fill="none"/>

  <!-- Grid Lines -->
  <line x1="80" y1="180" x2="520" y2="180" stroke="#64748b" stroke-width="1"/>
  <line x1="80" y1="220" x2="520" y2="220" stroke="#64748b" stroke-width="1"/>
  <line x1="80" y1="260" x2="520" y2="260" stroke="#64748b" stroke-width="1"/>
  <line x1="80" y1="300" x2="520" y2="300" stroke="#64748b" stroke-width="1"/>

  <!-- Legend -->
  <rect x="400" y="120" width="12" height="12" fill="#10b981"/>
  <text x="420" y="130" fill="white" font-family="Arial, sans-serif" font-size="12">Income</text>

  <rect x="400" y="140" width="12" height="12" fill="#3b82f6"/>
  <text x="420" y="150" fill="white" font-family="Arial, sans-serif" font-size="12">Expenses</text>

  <!-- KPI Cards -->
  <rect x="30" y="370" width="160" height="80" fill="url(#chartBg)" rx="8"/>
  <text x="50" y="390" fill="#10b981" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Avg Monthly Savings</text>
  <text x="50" y="410" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="bold">$2,145</text>

  <rect x="210" y="370" width="160" height="80" fill="url(#chartBg)" rx="8"/>
  <text x="230" y="390" fill="#f59e0b" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Budget Utilization</text>
  <text x="230" y="410" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="bold">78%</text>

  <rect x="390" y="370" width="160" height="80" fill="url(#chartBg)" rx="8"/>
  <text x="410" y="390" fill="#3b82f6" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Financial Goals</text>
  <text x="410" y="410" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="bold">3/5 Met</text>
</svg>
