<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#334155;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#475569;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- Header -->
  <rect x="0" y="0" width="600" height="80" fill="#0f172a"/>
  <text x="30" y="35" fill="#10b981" font-family="Arial, sans-serif" font-size="24" font-weight="bold">FINLY</text>
  <text x="30" y="55" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">Budget Planning</text>

  <!-- Navigation -->
  <rect x="200" y="25" width="80" height="30" fill="#10b981" rx="15"/>
  <text x="240" y="43" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Budget</text>

  <!-- Budget Overview -->
  <rect x="30" y="100" width="250" height="120" fill="url(#card)" rx="8"/>
  <text x="50" y="125" fill="#10b981" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Monthly Budget</text>
  <text x="50" y="150" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">$4,500</text>

  <!-- Progress Ring -->
  <circle cx="180" cy="160" r="35" fill="none" stroke="#334155" stroke-width="8"/>
  <circle cx="180" cy="160" r="35" fill="none" stroke="#10b981" stroke-width="8" stroke-dasharray="160" stroke-dashoffset="40"/>
  <text x="180" y="167" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">75%</text>

  <!-- Category Breakdown -->
  <rect x="300" y="100" width="270" height="260" fill="url(#card)" rx="8"/>
  <text x="320" y="125" fill="#10b981" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Budget Categories</text>

  <!-- Category Items -->
  <rect x="320" y="140" width="230" height="6" fill="#334155" rx="3"/>
  <rect x="320" y="140" width="184" height="6" fill="#10b981" rx="3"/>
  <text x="320" y="160" fill="white" font-family="Arial, sans-serif" font-size="12">Housing</text>
  <text x="520" y="160" fill="#10b981" font-family="Arial, sans-serif" font-size="12">$1,200 / $1,500</text>

  <rect x="320" y="175" width="230" height="6" fill="#334155" rx="3"/>
  <rect x="320" y="175" width="138" height="6" fill="#3b82f6" rx="3"/>
  <text x="320" y="195" fill="white" font-family="Arial, sans-serif" font-size="12">Food</text>
  <text x="520" y="195" fill="#3b82f6" font-family="Arial, sans-serif" font-size="12">$550 / $800</text>

  <rect x="320" y="210" width="230" height="6" fill="#334155" rx="3"/>
  <rect x="320" y="210" width="161" height="6" fill="#f59e0b" rx="3"/>
  <text x="320" y="230" fill="white" font-family="Arial, sans-serif" font-size="12">Transportation</text>
  <text x="520" y="230" fill="#f59e0b" font-family="Arial, sans-serif" font-size="12">$320 / $500</text>

  <rect x="320" y="245" width="230" height="6" fill="#334155" rx="3"/>
  <rect x="320" y="245" width="207" height="6" fill="#ef4444" rx="3"/>
  <text x="320" y="265" fill="white" font-family="Arial, sans-serif" font-size="12">Entertainment</text>
  <text x="520" y="265" fill="#ef4444" font-family="Arial, sans-serif" font-size="12">$180 / $250</text>

  <rect x="320" y="280" width="230" height="6" fill="#334155" rx="3"/>
  <rect x="320" y="280" width="115" height="6" fill="#8b5cf6" rx="3"/>
  <text x="320" y="300" fill="white" font-family="Arial, sans-serif" font-size="12">Utilities</text>
  <text x="520" y="300" fill="#8b5cf6" font-family="Arial, sans-serif" font-size="12">$230 / $400</text>

  <!-- Add Budget Button -->
  <rect x="30" y="240" width="250" height="50" fill="#10b981" rx="8"/>
  <text x="155" y="270" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">+ Add New Category</text>

  <!-- Savings Goal -->
  <rect x="30" y="310" width="250" height="70" fill="url(#card)" rx="8"/>
  <text x="50" y="330" fill="#f59e0b" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Emergency Fund Goal</text>
  <text x="50" y="350" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">$10,000</text>
  <text x="50" y="365" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">$7,250 saved</text>
</svg>
