<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="terminalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- Terminal Window -->
  <rect x="20" y="20" width="560" height="360" fill="url(#terminalBg)" rx="8"/>
  <rect x="20" y="20" width="560" height="30" fill="#2d3748" rx="8"/>

  <!-- Terminal Title Bar -->
  <circle cx="35" cy="35" r="6" fill="#ef4444"/>
  <circle cx="55" cy="35" r="6" fill="#f59e0b"/>
  <circle cx="75" cy="35" r="6" fill="#10b981"/>
  <text x="100" y="40" fill="#e2e8f0" font-family="Monaco, 'Courier New', monospace" font-size="12" font-weight="bold">socialconnect-cli ~ Analytics Dashboard</text>

  <!-- CLI Analytics Command -->
  <text x="40" y="80" fill="#10b981" font-family="Monaco, 'Courier New', monospace" font-size="14" font-weight="bold">$ socialconnect analytics dashboard</text>

  <text x="40" y="105" fill="#60a5fa" font-family="Monaco, 'Courier New', monospace" font-size="12">┌─ SocialConnect Analytics Dashboard ──────────────────────────────┐</text>

  <text x="40" y="125" fill="#e2e8f0" font-family="Monaco, 'Courier New', monospace" font-size="12">│ 📊 ENGAGEMENT METRICS (Last 30 days)</text>
  <text x="40" y="145" fill="#10b981" font-family="Monaco, 'Courier New', monospace" font-size="12">│ Total Posts:        247</text>
  <text x="40" y="160" fill="#60a5fa" font-family="Monaco, 'Courier New', monospace" font-size="12">│ Total Likes:        12,847</text>
  <text x="40" y="175" fill="#f59e0b" font-family="Monaco, 'Courier New', monospace" font-size="12">│ Total Shares:       1,203</text>
  <text x="40" y="190" fill="#ef4444" font-family="Monaco, 'Courier New', monospace" font-size="12">│ Total Comments:     3,892</text>

  <text x="40" y="210" fill="#e2e8f0" font-family="Monaco, 'Courier New', monospace" font-size="12">│ 📈 GROWTH TREND</text>
  <text x="40" y="225" fill="#10b981" font-family="Monaco, 'Courier New', monospace" font-size="12">│ Followers:          +15.7% (↑ 2,341 this month)</text>
  <text x="40" y="240" fill="#60a5fa" font-family="Monaco, 'Courier New', monospace" font-size="12">│ Engagement Rate:    4.2% (↑ 0.8% from last month)</text>
  <text x="40" y="255" fill="#f59e0b" font-family="Monaco, 'Courier New', monospace" font-size="12">│ Reach:              45,892 impressions</text>

  <text x="40" y="275" fill="#e2e8f0" font-family="Monaco, 'Courier New', monospace" font-size="12">│ 🕒 POSTING SCHEDULE</text>
  <text x="40" y="290" fill="#94a3b8" font-family="Monaco, 'Courier New', monospace" font-size="12">│ Best Time:          2:00 PM - 4:00 PM (UTC)</text>
  <text x="40" y="305" fill="#94a3b8" font-family="Monaco, 'Courier New', monospace" font-size="12">│ Best Day:           Wednesday</text>
  <text x="40" y="320" fill="#94a3b8" font-family="Monaco, 'Courier New', monospace" font-size="12">│ Scheduled Posts:    5 (next: Today 3:00 PM)</text>

  <text x="40" y="340" fill="#60a5fa" font-family="Monaco, 'Courier New', monospace" font-size="12">└─────────────────────────────────────────────────────────────────────┘</text>

  <!-- Progress Bar -->
  <text x="40" y="365" fill="#f59e0b" font-family="Monaco, 'Courier New', monospace" font-size="12">Engagement Goal Progress: [████████████░░░░] 75%</text>

  <!-- Cursor -->
  <rect x="40" y="385" width="10" height="2" fill="#10b981"/>
  <text x="55" y="390" fill="#10b981" font-family="Monaco, 'Courier New', monospace" font-size="12">_</text>

  <!-- Side Panel with Mini Stats -->
  <rect x="450" y="60" width="110" height="80" fill="#1e293b" rx="4"/>
  <text x="460" y="80" fill="#10b981" font-family="Monaco, 'Courier New', monospace" font-size="10" font-weight="bold">TOP POST</text>
  <text x="460" y="95" fill="#e2e8f0" font-family="Monaco, 'Courier New', monospace" font-size="9">"Amazing sunset! 🌅"</text>
  <text x="460" y="110" fill="#60a5fa" font-family="Monaco, 'Courier New', monospace" font-size="9">2.3K likes</text>
  <text x="460" y="125" fill="#f59e0b" font-family="Monaco, 'Courier New', monospace" font-size="9">487 shares</text>
</svg>
