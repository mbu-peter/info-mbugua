<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="terminalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- Terminal Window -->
  <rect x="20" y="20" width="560" height="360" fill="url(#terminalBg)" rx="8"/>
  <rect x="20" y="20" width="560" height="30" fill="#2d3748" rx="8"/>

  <!-- Terminal Title Bar -->
  <circle cx="35" cy="35" r="6" fill="#ef4444"/>
  <circle cx="55" cy="35" r="6" fill="#f59e0b"/>
  <circle cx="75" cy="35" r="6" fill="#10b981"/>
  <text x="100" y="40" fill="#e2e8f0" font-family="Monaco, 'Courier New', monospace" font-size="12" font-weight="bold">socialconnect-cli ~ Terminal</text>

  <!-- Terminal Content -->
  <text x="40" y="80" fill="#10b981" font-family="Monaco, 'Courier New', monospace" font-size="14" font-weight="bold">$ socialconnect --help</text>

  <text x="40" y="110" fill="#60a5fa" font-family="Monaco, 'Courier New', monospace" font-size="12">SocialConnect API - Terminal Interface v1.2.0</text>
  <text x="40" y="130" fill="#94a3b8" font-family="Monaco, 'Courier New', monospace" font-size="12">Manage your social media presence from the command line</text>

  <text x="40" y="160" fill="#f59e0b" font-family="Monaco, 'Courier New', monospace" font-size="12" font-weight="bold">USAGE:</text>
  <text x="40" y="180" fill="#e2e8f0" font-family="Monaco, 'Courier New', monospace" font-size="12">  socialconnect &lt;command&gt; [options]</text>

  <text x="40" y="210" fill="#f59e0b" font-family="Monaco, 'Courier New', monospace" font-size="12" font-weight="bold">COMMANDS:</text>
  <text x="40" y="230" fill="#60a5fa" font-family="Monaco, 'Courier New', monospace" font-size="12">  auth          Authenticate with social platforms</text>
  <text x="40" y="250" fill="#60a5fa" font-family="Monaco, 'Courier New', monospace" font-size="12">  posts         Manage posts and content</text>
  <text x="40" y="270" fill="#60a5fa" font-family="Monaco, 'Courier New', monospace" font-size="12">  analytics     View engagement metrics</text>
  <text x="40" y="290" fill="#60a5fa" font-family="Monaco, 'Courier New', monospace" font-size="12">  schedule      Schedule posts for publishing</text>
  <text x="40" y="310" fill="#60a5fa" font-family="Monaco, 'Courier New', monospace" font-size="12">  notifications Monitor real-time notifications</text>

  <text x="40" y="340" fill="#f59e0b" font-family="Monaco, 'Courier New', monospace" font-size="12" font-weight="bold">OPTIONS:</text>
  <text x="40" y="360" fill="#94a3b8" font-family="Monaco, 'Courier New', monospace" font-size="12">  --help, -h     Show this help message</text>
  <text x="40" y="375" fill="#94a3b8" font-family="Monaco, 'Courier New', monospace" font-size="12">  --version, -v  Show version information</text>

  <!-- Cursor -->
  <rect x="40" y="390" width="10" height="2" fill="#10b981"/>
  <text x="55" y="395" fill="#10b981" font-family="Monaco, 'Courier New', monospace" font-size="12">_</text>
</svg>
