<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#334155;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#475569;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- Header -->
  <rect x="0" y="0" width="600" height="80" fill="#0f172a"/>
  <rect x="0" y="0" width="600" height="8" fill="#dc2626"/>
  <text x="30" y="35" fill="#dc2626" font-family="Arial, sans-serif" font-size="24" font-weight="bold">HOSPITAL</text>
  <text x="30" y="55" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">Appointment Scheduling</text>

  <!-- Navigation -->
  <rect x="200" y="25" width="130" height="30" fill="#dc2626" rx="15"/>
  <text x="265" y="43" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Appointments</text>

  <!-- Calendar -->
  <rect x="30" y="100" width="350" height="250" fill="url(#card)" rx="8"/>
  <text x="50" y="125" fill="#dc2626" font-family="Arial, sans-serif" font-size="14" font-weight="bold">January 2024</text>

  <!-- Calendar Header -->
  <text x="70" y="150" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Mon</text>
  <text x="110" y="150" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Tue</text>
  <text x="150" y="150" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Wed</text>
  <text x="190" y="150" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Thu</text>
  <text x="230" y="150" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Fri</text>
  <text x="270" y="150" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Sat</text>
  <text x="310" y="150" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Sun</text>

  <!-- Calendar Days -->
  <circle cx="70" cy="170" r="12" fill="#dc2626"/>
  <text x="70" y="175" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">1</text>

  <circle cx="110" cy="190" r="12" fill="#10b981"/>
  <text x="110" y="195" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">2</text>

  <circle cx="150" cy="210" r="12" fill="#3b82f6"/>
  <text x="150" y="215" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">3</text>

  <!-- Today's Appointments -->
  <rect x="400" y="100" width="170" height="120" fill="url(#card)" rx="8"/>
  <text x="420" y="125" fill="#dc2626" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Today's Schedule</text>

  <rect x="420" y="135" width="130" height="20" fill="#1e293b" rx="4"/>
  <text x="430" y="148" fill="white" font-family="Arial, sans-serif" font-size="10">09:00 - Dr. Smith</text>

  <rect x="420" y="160" width="130" height="20" fill="#1e293b" rx="4"/>
  <text x="430" y="173" fill="white" font-family="Arial, sans-serif" font-size="10">10:30 - Dr. Johnson</text>

  <rect x="420" y="185" width="130" height="20" fill="#1e293b" rx="4"/>
  <text x="430" y="198" fill="white" font-family="Arial, sans-serif" font-size="10">14:00 - Dr. Williams</text>

  <!-- Quick Booking -->
  <rect x="400" y="240" width="170" height="110" fill="url(#card)" rx="8"/>
  <text x="420" y="265" fill="#dc2626" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Quick Book</text>

  <rect x="420" y="280" width="130" height="25" fill="#dc2626" rx="4"/>
  <text x="485" y="295" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">+ New Appointment</text>

  <!-- Department Filter -->
  <text x="420" y="325" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Filter by Department:</text>
  <rect x="420" y="330" width="50" height="15" fill="#10b981" rx="7"/>
  <text x="445" y="340" fill="white" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Cardio</text>

  <rect x="480" y="330" width="50" height="15" fill="#3b82f6" rx="7"/>
  <text x="505" y="340" fill="white" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Neuro</text>

  <!-- Time Slots -->
  <rect x="30" y="370" width="540" height="20" fill="#0f172a" rx="4"/>
  <text x="50" y="383" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11">Available slots: 08:00, 09:00, 10:00, 11:00, 13:00, 14:00, 15:00, 16:00</text>
</svg>
