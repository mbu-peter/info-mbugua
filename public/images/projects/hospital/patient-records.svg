<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#334155;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#475569;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- Header -->
  <rect x="0" y="0" width="600" height="80" fill="#0f172a"/>
  <rect x="0" y="0" width="600" height="8" fill="#dc2626"/>
  <text x="30" y="35" fill="#dc2626" font-family="Arial, sans-serif" font-size="24" font-weight="bold">HOSPITAL</text>
  <text x="30" y="55" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">Patient Records</text>

  <!-- Navigation -->
  <rect x="200" y="25" width="120" height="30" fill="#dc2626" rx="15"/>
  <text x="260" y="43" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Patient Records</text>

  <!-- Patient Search -->
  <rect x="30" y="100" width="540" height="50" fill="url(#card)" rx="8"/>
  <circle cx="60" cy="125" r="12" fill="#64748b"/>
  <line x1="55" y1="135" x2="65" y2="135" stroke="white" stroke-width="2"/>
  <text x="85" y="135" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">Search patients by name, ID, or condition...</text>

  <!-- Patient List Header -->
  <rect x="30" y="170" width="540" height="30" fill="#dc2626" rx="4"/>
  <text x="50" y="188" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">PATIENT NAME</text>
  <text x="250" y="188" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">ID</text>
  <text x="350" y="188" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">CONDITION</text>
  <text x="480" y="188" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">STATUS</text>

  <!-- Patient Records -->
  <rect x="30" y="200" width="540" height="35" fill="url(#card)" rx="4"/>
  <circle cx="50" cy="217" r="8" fill="#3b82f6"/>
  <text x="70" y="222" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">John Doe</text>
  <text x="250" y="222" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">PT-2024-001</text>
  <text x="350" y="222" fill="white" font-family="Arial, sans-serif" font-size="12">Hypertension</text>
  <rect x="470" y="210" width="60" height="15" fill="#10b981" rx="7"/>
  <text x="500" y="220" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Stable</text>

  <rect x="30" y="235" width="540" height="35" fill="url(#card)" rx="4"/>
  <circle cx="50" cy="252" r="8" fill="#f59e0b"/>
  <text x="70" y="257" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Jane Smith</text>
  <text x="250" y="257" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">PT-2024-002</text>
  <text x="350" y="257" fill="white" font-family="Arial, sans-serif" font-size="12">Diabetes Type 2</text>
  <rect x="470" y="245" width="60" height="15" fill="#f59e0b" rx="7"/>
  <text x="500" y="255" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Monitor</text>

  <rect x="30" y="270" width="540" height="35" fill="url(#card)" rx="4"/>
  <circle cx="50" cy="287" r="8" fill="#10b981"/>
  <text x="70" y="292" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Bob Wilson</text>
  <text x="250" y="292" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">PT-2024-003</text>
  <text x="350" y="292" fill="white" font-family="Arial, sans-serif" font-size="12">Post-Surgery Recovery</text>
  <rect x="470" y="280" width="60" height="15" fill="#10b981" rx="7"/>
  <text x="500" y="290" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Good</text>

  <!-- Patient Detail Panel -->
  <rect x="30" y="320" width="250" height="60" fill="url(#card)" rx="8"/>
  <text x="50" y="340" fill="#dc2626" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Patient Details</text>
  <text x="50" y="355" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11">Age: 45 • Blood Type: O+ • Allergies: None</text>
  <text x="50" y="370" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11">Last Visit: 2024-01-15 • Room: 204</text>

  <!-- Quick Stats -->
  <rect x="300" y="320" width="130" height="60" fill="url(#card)" rx="8"/>
  <text x="320" y="340" fill="#10b981" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Active Patients</text>
  <text x="320" y="360" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="bold">1,247</text>

  <rect x="450" y="320" width="120" height="60" fill="url(#card)" rx="8"/>
  <text x="470" y="340" fill="#3b82f6" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Critical Cases</text>
  <text x="470" y="360" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="bold">12</text>
</svg>
