<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#334155;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#475569;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- Header -->
  <rect x="0" y="0" width="600" height="80" fill="#0f172a"/>
  <rect x="0" y="0" width="600" height="8" fill="#dc2626"/>
  <text x="30" y="35" fill="#dc2626" font-family="Arial, sans-serif" font-size="24" font-weight="bold">HOSPITAL</text>
  <text x="30" y="55" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">Management System</text>

  <!-- Navigation -->
  <rect x="200" y="25" width="100" height="30" fill="#dc2626" rx="15"/>
  <text x="250" y="43" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Dashboard</text>

  <!-- Stats Cards -->
  <rect x="30" y="100" width="160" height="100" fill="url(#card)" rx="8"/>
  <circle cx="60" cy="130" r="15" fill="#10b981"/>
  <text x="85" y="125" fill="#10b981" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Total Patients</text>
  <text x="85" y="145" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">1,247</text>

  <rect x="210" y="100" width="160" height="100" fill="url(#card)" rx="8"/>
  <circle cx="240" cy="130" r="15" fill="#3b82f6"/>
  <text x="265" y="125" fill="#3b82f6" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Today's Appointments</text>
  <text x="265" y="145" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">42</text>

  <rect x="390" y="100" width="160" height="100" fill="url(#card)" rx="8"/>
  <circle cx="420" cy="130" r="15" fill="#f59e0b"/>
  <text x="445" y="125" fill="#f59e0b" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Available Beds</text>
  <text x="445" y="145" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">18</text>

  <!-- Appointments List -->
  <rect x="30" y="220" width="350" height="150" fill="url(#card)" rx="8"/>
  <text x="50" y="245" fill="#dc2626" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Today's Appointments</text>

  <!-- Appointment Items -->
  <rect x="50" y="255" width="300" height="20" fill="#1e293b" rx="4"/>
  <text x="60" y="268" fill="white" font-family="Arial, sans-serif" font-size="12">Dr. Smith - John Doe (Cardiology)</text>
  <text x="320" y="268" fill="#10b981" font-family="Arial, sans-serif" font-size="10">09:00 AM</text>

  <rect x="50" y="280" width="300" height="20" fill="#1e293b" rx="4"/>
  <text x="60" y="293" fill="white" font-family="Arial, sans-serif" font-size="12">Dr. Johnson - Jane Smith (Neurology)</text>
  <text x="320" y="293" fill="#3b82f6" font-family="Arial, sans-serif" font-size="10">10:30 AM</text>

  <rect x="50" y="305" width="300" height="20" fill="#1e293b" rx="4"/>
  <text x="60" y="318" fill="white" font-family="Arial, sans-serif" font-size="12">Dr. Williams - Bob Wilson (Orthopedics)</text>
  <text x="320" y="318" fill="#f59e0b" font-family="Arial, sans-serif" font-size="10">02:15 PM</text>

  <!-- Quick Actions -->
  <rect x="400" y="220" width="170" height="150" fill="url(#card)" rx="8"/>
  <text x="420" y="245" fill="#dc2626" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Quick Actions</text>

  <rect x="420" y="260" width="130" height="25" fill="#dc2626" rx="4"/>
  <text x="485" y="275" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">+ New Patient</text>

  <rect x="420" y="295" width="130" height="25" fill="#10b981" rx="4"/>
  <text x="485" y="310" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Schedule Appointment</text>

  <rect x="420" y="330" width="130" height="25" fill="#3b82f6" rx="4"/>
  <text x="485" y="345" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">View Reports</text>
</svg>
